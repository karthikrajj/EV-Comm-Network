version: '3.8'

services:
  ev-comm-network:
    build: .
    ports:
      - "5000:5000"
      - "9000:9000"
      - "9001:9001/udp"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
